name: Build coverage features

on:
  workflow_dispatch:
  push:
    paths:
      - "data/raw/bravo_stores.csv"
      - "data/raw/osm_food_retail.geojson"
      - "data/raw/osm_transit.geojson"
      - "data/raw/baku_boundary.geojson"
      - "src/build_coverage_grid.py"
      - ".github/workflows/build-features.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy geopandas shapely folium

      - name: Build coverage grid
        run: python src/build_coverage_grid.py

      - name: Commit processed features
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/coverage_grid.csv
          git add data/processed/coverage_grid.geojson
          git add outputs/coverage_gap_map.html
          if git diff --cached --quiet; then
            echo "No feature changes to commit."
          else
            git commit -m "Build first Baku coverage features"
            git push
          fi
