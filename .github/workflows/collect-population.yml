name: Collect official population data

on:
  workflow_dispatch:
  push:
    paths:
      - "src/collect_population.py"
      - ".github/workflows/collect-population.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests xlrd

      - name: Collect official population table
        run: python src/collect_population.py

      - name: Commit parsed population table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/raw/stat_population_area_density_raw.csv
          if git diff --cached --quiet; then
            echo "No population-data changes to commit."
          else
            git commit -m "Refresh official population table"
            git push
          fi
