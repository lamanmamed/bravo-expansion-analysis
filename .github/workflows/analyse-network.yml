name: Analyse Bravo network

on:
  workflow_dispatch:
  push:
    paths:
      - "data/raw/bravo_stores.csv"
      - "data/raw/baku_boundary.geojson"
      - "src/analyze_bravo_network.py"
      - "src/map_bravo_network.py"
      - ".github/workflows/analyse-network.yml"

concurrency:
  group: analyse-network
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy geopandas shapely matplotlib folium

      - name: Analyse network
        run: python src/analyze_bravo_network.py

      - name: Build interactive network map
        run: python src/map_bravo_network.py

      - name: Commit analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/processed/bravo_store_metrics.csv
          git add outputs/network_summary.md
          git add outputs/store_format_mix.png
          git add outputs/nearest_bravo_distance.png
          git add outputs/bravo_network_map.html
          if git diff --cached --quiet; then
            echo "No network-analysis changes to commit."
          else
            git commit -m "Add Bravo network analysis outputs"
            git push
          fi