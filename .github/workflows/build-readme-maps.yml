name: Build README maps

on:
  workflow_dispatch:
  push:
    paths:
      - "src/build_readme_maps.py"
      - "data/raw/baku_boundary.geojson"
      - "data/raw/bravo_stores.csv"
      - "data/processed/expansion_screen_cells.geojson"
      - "data/processed/candidate_zones.csv"
      - ".github/workflows/build-readme-maps.yml"

concurrency:
  group: build-readme-maps
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas shapely matplotlib

      - name: Build README maps
        run: python src/build_readme_maps.py

      - name: Commit maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/readme_bravo_network.png
          git add outputs/readme_shortlist_map.png

          if git diff --cached --quiet; then
            echo "No README map changes to commit."
            exit 0
          fi

          git commit -m "Refresh README maps"

          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            sleep 3
          done

          exit 1
