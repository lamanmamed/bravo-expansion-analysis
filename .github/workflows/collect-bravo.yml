name: Collect Bravo store data

on:
  workflow_dispatch:
  push:
    paths:
      - "src/collect_bravo_stores.py"
      - ".github/workflows/collect-bravo.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Collect official Bravo store data
        run: python src/collect_bravo_stores.py

      - name: Commit refreshed store snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/bravo_stores.csv
          if git diff --cached --quiet; then
            echo "No store-data changes to commit."
          else
            git commit -m "Refresh Bravo store snapshot"
            git push
          fi
