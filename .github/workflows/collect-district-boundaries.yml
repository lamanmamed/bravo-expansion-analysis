name: Collect Baku district boundaries

on:
  workflow_dispatch:
  push:
    paths:
      - "src/collect_baku_district_boundaries.py"
      - ".github/workflows/collect-district-boundaries.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect Baku district boundaries
        run: python src/collect_baku_district_boundaries.py

      - name: Commit district boundaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/baku_district_boundaries.geojson

          if git diff --cached --quiet; then
            echo "No district-boundary changes to commit."
            exit 0
          fi

          git commit -m "Refresh Baku district boundaries"

          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 3
          done

          exit 1
