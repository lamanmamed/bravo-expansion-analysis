name: Analyse screening diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "src/analyze_screen_diagnostics.py"
      - "data/processed/coverage_grid.geojson"
      - "data/processed/grid_district_assignments.csv"
      - "data/processed/baku_district_population_2026.csv"
      - "data/processed/candidate_zones.csv"
      - "data/processed/expansion_screen_cells.csv"
      - ".github/workflows/analyse-screen-diagnostics.yml"

concurrency:
  group: analyse-screen-diagnostics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy geopandas scikit-learn matplotlib

      - name: Build diagnostics
        run: python src/analyze_screen_diagnostics.py

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/model_validation_by_fold.csv
          git add data/processed/context_model_coefficients.csv
          git add data/processed/candidate_zone_profiles.csv
          git add outputs/context_model_coefficients.png
          git add outputs/candidate_zone_profiles.md

          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
            exit 0
          fi

          git commit -m "Add screening diagnostics"

          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            sleep 3
          done

          exit 1
