name: Build expansion screen

on:
  workflow_dispatch:
  push:
    paths:
      - "src/build_expansion_screen.py"
      - "data/processed/grid_district_assignments.csv"
      - "data/processed/baku_district_population_2026.csv"
      - "data/processed/coverage_grid.geojson"
      - "data/raw/bravo_stores.csv"
      - ".github/workflows/build-expansion-screen.yml"

concurrency:
  group: build-expansion-screen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy geopandas shapely scikit-learn folium matplotlib

      - name: Build and validate expansion screen
        run: python src/build_expansion_screen.py

      - name: Commit screening outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/expansion_screen_cells.csv
          git add data/processed/expansion_screen_cells.geojson
          git add data/processed/candidate_zones.csv
          git add outputs/expansion_screen_summary.md
          git add outputs/expansion_screen_map.html
          git add outputs/expansion_screen_map.png
          git add outputs/model_validation_auc.png

          if git diff --cached --quiet; then
            echo "No expansion-screen changes to commit."
            exit 0
          fi

          git commit -m "Build validated expansion screening outputs"

          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            sleep 3
          done

          exit 1